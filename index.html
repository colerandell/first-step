<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Break vague career and school tasks into one small step a day.">
<meta name="theme-color" content="#1F4D3A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%231F4D3A%22/%3E%3Cpath d=%22M5 17h5v-5h5V7h4%22 fill=%22none%22 stroke=%22%23F6F3EC%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>First Step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E8E4D9; --app:#F6F3EC; --surface:#FFFDF8; --sunk:#F0ECE2; --ink:#1C2A22; --muted:#5B685F; --line:#DDD7C9;
  --accent:#1F4D3A; --accent-ink:#F6F3EC; --accent-soft:#E2EBE3;
  --mark:#E9DFC6; --mark-ink:#3B3016; --warn:#86561C; --err:#A63A1C;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:var(--body);
  --app-w:460px;
}
@media (min-width:760px){:root{--app-w:720px}}
@media (min-width:1100px){:root{--app-w:860px}}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0A110D; --app:#0F1813; --surface:#15221B; --sunk:#111C16; --ink:#EDE9DF; --muted:#A3AEA5; --line:#26362D;
    --accent:#8FC4A2; --accent-ink:#0E1A13; --accent-soft:#1C3226; --mark:#3A3421; --mark-ink:#EADBB0; --warn:#E2B679; --err:#FF9A7A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0A110D; --app:#0F1813; --surface:#15221B; --sunk:#111C16; --ink:#EDE9DF; --muted:#A3AEA5; --line:#26362D;
  --accent:#8FC4A2; --accent-ink:#0E1A13; --accent-soft:#1C3226; --mark:#3A3421; --mark-ink:#EADBB0; --warn:#E2B679; --err:#FF9A7A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.app{max-width:var(--app-w);min-height:100%;margin:0 auto;background:var(--app);display:flex;flex-direction:column;position:relative}
@media (min-width:500px){.app{border-inline:1px solid var(--line)}}
.screen{flex:1;display:flex;flex-direction:column;gap:22px;padding-inline:max(20px,env(safe-area-inset-left),env(safe-area-inset-right));padding-top:max(24px,env(safe-area-inset-top));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.screen.center{justify-content:center;padding-block:40px}
h1{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-0.01em;margin:0;text-wrap:balance}
h2{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:0}
.section{display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:44px;font-weight:600}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
button.block{width:100%;min-height:50px;font-size:16px}
button.quiet{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px;font-weight:500}
button.quiet:hover{color:var(--ink);border-color:var(--line)}
button.danger{color:var(--err)}
button:disabled{opacity:.55;cursor:default}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--err)}
.muted{color:var(--muted);margin:0}

/* brand */
.logo{width:76px;height:76px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo svg{width:44px;height:44px}
.logo.sm{width:34px;height:34px;border-radius:10px}.logo.sm svg{width:20px;height:20px}
.wordmark{font-family:var(--display);font-weight:600;font-size:38px;letter-spacing:-0.02em;margin:0}
.wordmark span{color:var(--accent)}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.stack{display:flex;flex-direction:column;gap:10px}
.fine{font-size:12.5px;color:var(--muted);margin:0}

/* chips (radio) */
.chips{display:flex;flex-wrap:wrap;gap:8px;border:0;padding:0;margin:0}
.chips legend{padding:0;margin-bottom:8px}
.chips label{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer}
.chips input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.chips input:checked + span{color:var(--accent);font-weight:600}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chips label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar .who{display:flex;gap:10px;align-items:center}
.date{font-size:13px;color:var(--muted);font-weight:500}

/* today */
.kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-variant-numeric:tabular-nums;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.mark{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.pill.ex{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.step-head{font-family:var(--display);font-weight:600;font-size:clamp(22px,6vw,28px);line-height:1.2;letter-spacing:-0.015em;margin:0;text-wrap:balance}
.from{color:var(--muted);margin:0}
.from b{color:var(--ink);font-weight:600}
.stakes{margin:0;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;color:var(--warn);font-variant-numeric:tabular-nums}

/* tasks */
.list{display:flex;flex-direction:column;gap:12px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.task-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.task-title{font-weight:600;font-size:16px;margin:0;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ctx{font-size:13px;color:var(--muted);margin:0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:center;padding:2px 4px;border-radius:8px}
ol.steps li.next{background:var(--accent-soft)}
ol.steps input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent);margin:0;cursor:pointer}
textarea.step-edit{font:inherit;color:var(--ink);width:100%;resize:none;overflow:hidden;field-sizing:content;border:1px solid transparent;border-radius:10px;background:transparent;padding:6px 8px;min-height:38px;line-height:1.4}
textarea.step-edit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.step-edit:hover{border-color:var(--line)}
textarea.step-edit:focus{background:var(--surface);border-color:var(--accent)}
li.done textarea.step-edit{color:var(--muted);text-decoration:line-through}
.mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.add-step{display:flex;gap:8px}
.add-step input{min-height:40px}
.add-step button{min-height:40px;white-space:nowrap}
.q-grid{display:grid;grid-template-columns:150px 1fr;gap:12px}
@media (max-width:400px){.q-grid{grid-template-columns:1fr}}
.qtitle{font-weight:600;margin:0;font-size:17px}

/* settings */
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;min-height:60px}
.setting + .setting{border-top:1px solid var(--line)}
.setting .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.setting .name{font-weight:600}
.setting .desc{font-size:13px;color:var(--muted)}
.setting select{width:auto;min-width:120px}
.switch{position:relative;flex:none;width:50px;height:30px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;min-height:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.confirm{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--sunk)}

/* bottom nav */
.cal{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--sunk);border:1px solid var(--line)}
.cal .opts{display:flex;flex-wrap:wrap;gap:8px}
.cal .opts button{font-weight:500}
.cal .opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.on-cal{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--accent);font-weight:600;margin:0}
.on-cal svg{width:18px;height:18px}
button > svg{width:18px;height:18px;flex:none;vertical-align:-3px;margin-right:4px}
.tour{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding-inline:20px;padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom))}
.tour-top{display:flex;justify-content:space-between;align-items:center}
.tour-count{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.tour-body{display:flex;flex-direction:column;gap:18px}
.tour-icon{width:88px;height:88px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tour-icon svg{width:42px;height:42px}
.tour-body h1{font-size:32px}
.tour-body .sub{font-size:16.5px;line-height:1.55}
.tour-tip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--muted);margin:0}
.tour-tip b{color:var(--ink)}
.dots{display:flex;gap:8px;justify-content:center}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent);width:22px;border-radius:99px}
.start{display:flex;flex-direction:column;gap:14px}
.start ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.start ol b{color:var(--ink)}
.build-top{display:flex;align-items:center;gap:8px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.stat .num{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stat .lab{font-size:13.5px;line-height:1.4;color:var(--ink)}
.bet{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:22px;font-family:var(--display);font-weight:500;font-size:20px;line-height:1.4;margin:0}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.metric .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.metric .name{font-weight:600;font-size:15.5px}
.metric .goal{font-family:var(--display);font-weight:600;font-size:18px;color:var(--accent);white-space:nowrap}
.metric .why{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0}
.metric .kind{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
ol.changes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:c}
ol.changes li{counter-increment:c;display:grid;grid-template-columns:30px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
ol.changes li::before{content:counter(c);font-family:var(--display);font-weight:600;font-size:18px;color:var(--accent)}
ol.changes b{display:block;font-size:15px;margin-bottom:2px}
ol.changes span{font-size:13.5px;line-height:1.5;color:var(--muted)}
.src{font-size:12.5px;color:var(--muted);margin:0}
.step-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ai-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;white-space:nowrap}
.ai-tag svg{width:11px;height:11px}
.ai-zone{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.ai-zone .lbl{display:flex;align-items:center;gap:6px;color:var(--accent)}
.ai-zone .lbl svg{width:14px;height:14px}
.ai-card{background:var(--accent-soft);border:1px solid transparent;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.ai-card h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px;color:var(--accent)}
.ai-card h3 svg{width:16px;height:16px}
.ai-card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.45;color:var(--ink)}
.ai-card p{margin:0;font-size:13px;color:var(--muted)}
.presets{display:flex;flex-direction:column;gap:8px}
.presets .opts{display:flex;flex-wrap:wrap;gap:8px}
.presets button{font-weight:500;font-size:14px;border-radius:999px;min-height:40px;padding:6px 14px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:12px;font-weight:600;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkish{background:none;border:0;padding:0;min-height:auto;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(var(--app-w),100%);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs button{border:0;border-radius:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;min-height:60px;font-size:11.5px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* sign-in, sign-up and tour screens: no tab bar, so less bottom room; a centered card on bigger screens */
.app[data-view="auth"] .screen{padding-bottom:max(40px,env(safe-area-inset-bottom))}
.req{color:var(--err);margin-left:2px}
@media (min-width:760px){
  .app[data-view="auth"]{max-width:520px;min-height:0;margin:48px auto;border:1px solid var(--line);border-radius:24px;overflow:hidden}
  .app[data-view="auth"] .screen{padding:40px 44px}
  .app[data-view="main"] .screen{padding-inline:36px;padding-top:36px}
  h1{font-size:32px}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
}
@media (min-width:1100px){
  .app[data-view="main"] .list{display:grid;grid-template-columns:1fr 1fr;align-items:start}
}
@media (prefers-reduced-motion:reduce){.switch .track,.switch .track::after{transition:none}}
</style>
<style>body{margin:0}</style>

<body>
<div class="app" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const DAY = 86400000;
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const hostTheme = root.getAttribute("data-theme");

  const DEFAULT_SETTINGS = { stakes: true, askQuestions: true, firstStepMax: 10, maxSteps: 5, noDeadlineFirst: true, theme: "system", calendar: true };
  const FOCUS = ["School", "Job search", "Career growth", "Returning to work", "Something else"];

  const state = {
    screen: "splash", tab: "today",
    tasks: new Map(), settings: { ...DEFAULT_SETTINGS }, profile: null, claudeName: "",
    ready: false, mode: "loading", busy: new Set(), capture: { phase: "idle" },
    hideExample: false, extraToday: 0, todayDone: null, confirmDelete: false
  };
  let col = null, sample = null;
  const calState = { stepKey: "", open: false, pick: "", custom: "", busy: false, msg: "", err: false };

  const EXAMPLE = {
    id: "example", example: true, title: "Update portfolio website",
    purposeQ: "What's the portfolio for?", purpose: "Landing new freelance clients",
    timing: null, createdAt: Date.now() - 42*DAY, lastProgressAt: Date.now() - 42*DAY, snoozedUntil: 0,
    steps: [
      { id:"e1", text:"List the 3 projects from this year you'd most want a client to see", minutes:10, done:false },
      { id:"e2", text:"Swap the oldest homepage project for the strongest of those 3", minutes:30, done:false },
      { id:"e3", text:"Write a 2-sentence caption for each new project: brief and result", minutes:20, done:false },
      { id:"e4", text:"Update the About line with your current rate and availability", minutes:10, done:false }
    ]
  };

  // ---------- helpers ----------
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2)).replace(/-/g,"").slice(0,16);
  function h(tag, props, ...kids){
    const el = document.createElement(tag);
    if (props) for (const [k,v] of Object.entries(props)){
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k in el && k !== "list") { try { el[k] = v; } catch { el.setAttribute(k, v); } }
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  }
  function svg(paths, extra=""){
    const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor");
    s.setAttribute("stroke-width","2"); s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round"); s.setAttribute("aria-hidden","true");
    s.innerHTML = paths + extra; return s;
  }
  const ICONS = {
    today: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

      id: uid(), title: c.title.slice(0,200),
      purposeQ: c.vague ? c.question : "", purpose: !skip ? (c.purpose || "").trim().slice(0,200) : "",
      timing: !skip && c.date ? { date: c.date, label: (c.label || "").trim().slice(0,60) || "Deadline" } : null,
      createdAt: Date.now(), lastProgressAt: Date.now(), snoozedUntil: 0, steps: []
    };
    c.phase = "generating"; render();
    let msg = "", err = false;
    if (sample) {
      try { t.steps = cleanSteps(await sample.json(breakdownPrompt(t))); if (!t.steps.length) { msg = "No steps came back. Add your first one in Tasks."; err = true; } }
      catch(e){ msg = aiErr(e); err = true; }
    } else { msg = "Added. AI steps aren't set up yet, so add your first step in Tasks."; err = true; }
    state.extraToday = 0; state.todayDone = null;
    stats.added++; saveStats();
    await persist(t);
    state.capture = { phase: "idle", msg, err };
    state.tab = err ? "tasks" : "today"; render();
  }

  // ---------- app: tasks ----------
  function renderTask(t){
    const done = t.steps.filter(s => s.done).length;
    const nxt = nextStep(t);
    const input = h("input", { placeholder: t.steps.length ? "Add a step" : "What's the very first thing you'd do?", maxlength:"160", "aria-label": "New step for " + t.title });
    const submitStep = () => { const v = input.value.trim(); if (v) addStep(t, v); };
    input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submitStep(); } });
    const regenBusy = state.busy.has(t.id);
    const ctx = [t.purpose || null, hasDeadline(t) ? `${t.timing.label || "Deadline"}: ${new Date(t.timing.date+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}` : "No deadline"].filter(Boolean).join(" · ");
    return h("article", { class:"task" },
      h("div", { class:"task-head" },
        h("div", null,
          h("p", { class:"task-title", text: t.title }),
          h("div", { class:"meta" },
            t.example ? h("span", { class:"pill ex", text:"Example" }) : null,
            h("span", { class:"pill", text: isDone(t) ? "Finished" : `${done}/${t.steps.length} steps` }),
            t.snoozedUntil > Date.now() ? h("span", { class:"pill", text:"Back tomorrow" }) : null)),
        h("button", { class:"quiet", type:"button", text: t.example ? "Hide" : "Delete", "aria-label": (t.example ? "Hide example " : "Delete ") + t.title,
          onclick: () => { if (t.example) { state.hideExample = true; render(); } else removeTask(t.id); } })),
      h("p", { class:"ctx", text: ctx }),
      h("ol", { class:"steps" }, t.steps.map(s => {
        const edit = h("textarea", { class:"step-edit", value: s.text, maxlength:"160", rows: String(Math.max(1, Math.ceil(s.text.length / 34))), "aria-label":"Edit step" });
        edit.addEventListener("change", () => editStep(t, s.id, edit.value));
        edit.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); edit.blur(); } if (e.key === "Escape") { edit.value = s.text; edit.blur(); } });
        return h("li", { class: (s.done ? "done" : "") + (nxt && s.id === nxt.id ? " next" : "") },
          h("input", { type:"checkbox", checked: !!s.done, "aria-label": (s.done ? "Mark not done: " : "Mark done: ") + s.text, onchange: () => toggleStep(t, s.id) }),
          edit, h("div", { class:"step-side" }, (s.ai && !s.edited) ? h("span", { class:"ai-tag", title:"Written by Claude. Tap the step to change it." }, svg(SPARK), "AI") : null, h("span", { class:"mins", text: `${s.minutes}m` })));
      })),
      h("div", { class:"add-step" }, input, h("button", { type:"button", text:"Add", onclick: submitStep })),
      (sample && !isDone(t)) ? h("div", { class:"ai-zone" }, h("span", { class:"lbl" }, svg(SPARK), "AI can do this for you"), h("div", { class:"row" }, h("button", { class:"quiet", type:"button", text: regenBusy ? "Rewriting…" : "Regenerate unfinished steps", disabled: regenBusy, onclick: () => regenerate(t) }))) : null);
  }
  function tabTasks(){
    const v = visibleTasks(), active = v.filter(t => !isDone(t)), finished = v.filter(isDone);
    const out = [h("h1", { text:"Tasks" }), h("p", { class:"sub", text: `${plural(active.length, "open task")}${finished.length ? ` · ${finished.length} finished` : ""}. Tap any step to edit it.` })];
    if (v.length) out.push(h("div", { class:"ai-card", role:"note" },
      h("h3", null, svg(SPARK), "What the AI does"),
      h("ul", null,
        h("li", { text:"Writes steps from your task and your answers. Those steps are marked AI." }),
        h("li", { text:"Splits a step that's still too big (on Today)." }),
        h("li", { text:"Rewrites the steps you haven't done (Regenerate)." })),
      h("p", { text:"Everything else is you: edit any step, add your own, check them off. A step you edit loses its AI mark." })));
    if (state.capture.msg && state.capture.err) out.push(h("p", { class:"status err", role:"status", text: state.capture.msg }));
    out.push(h("div", { class:"list" }, active.map(renderTask)));
    if (finished.length) out.push(h("h2", { text:"Finished" }), h("div", { class:"list" }, finished.map(renderTask)));
    if (!v.length) out.push(h("div", { class:"card" }, h("p", { class:"muted", text:"No tasks yet. Everything you add shows up here with all its steps." }), h("div", { class:"row" }, h("button", { class:"primary", type:"button", text:"Add your first task", onclick: () => { state.tab = "add"; render(); } }))));
    return out;
  }

  // ---------- app: settings ----------
  function settingRow(name, desc, control, forId){
    return h("div", { class:"setting" }, h("div", { class:"txt" }, forId ? h("label", { for: forId, class:"name", style:"font-size:15px;color:var(--ink)", text: name }) : h("span", { class:"name", text: name }), desc ? h("span", { class:"desc", text: desc }) : null), control);
  }
  function toggle(id, key){
    const inp = h("input", { type:"checkbox", id, role:"switch", checked: !!state.settings[key], onchange: e => { state.settings[key] = e.target.checked; saveSettings(); } });
    return h("span", { class:"switch" }, inp, h("span", { class:"track" }));
  }
  function select(id, key, options, parse){
    const sel = h("select", { id, onchange: e => { state.settings[key] = parse ? parse(e.target.value) : e.target.value; saveSettings(); } },
      options.map(([v, l]) => h("option", { value: String(v), text: l, selected: String(state.settings[key]) === String(v) })));
    return sel;
  }
  function tabSettings(){
    const p = state.profile || {};
    const nameIn = h("input", { id:"set-name", value: p.name || "", maxlength:"60", style:"width:150px" });
    nameIn.addEventListener("change", () => { const n = nameIn.value.trim(); if (n) { state.profile = { ...state.profile, name: n }; saveProfile(); render(); } else nameIn.value = p.name || ""; });
    const emailIn = h("input", { id:"set-email", type:"email", value: p.email || "", maxlength:"120", style:"width:190px" });
    emailIn.addEventListener("change", () => { const v = emailIn.value.trim(); if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { state.profile = { ...state.profile, email: v }; saveProfile(); } else emailIn.value = p.email || ""; });
    const focusSel = h("select", { id:"set-focus", onchange: e => { state.profile = { ...state.profile, focus: e.target.value }; saveProfile(); } }, FOCUS.map(f => h("option", { value:f, text:f, selected: p.focus === f })));

    const danger = h("div", { class:"group" },
      settingRow("Sign out", "Your tasks stay saved to your account.", h("button", { type:"button", text:"Sign out", onclick: signOut })),
      settingRow("Delete account and data", "Removes every task and setting. This can't be undone.", h("button", { class:"danger", type:"button", text:"Delete", onclick: () => { state.confirmDelete = true; render(); } })));
    if (state.confirmDelete) danger.append(h("div", { class:"confirm", role:"alertdialog", "aria-label":"Confirm delete" },
      h("p", { style:"margin:0;font-weight:600", text:`Delete ${plural(state.tasks.size, "task")} and your account?` }),
      h("div", { class:"row" },
        h("button", { class:"danger", type:"button", text:"Yes, delete everything", onclick: deleteAll }),
        h("button", { class:"quiet", type:"button", text:"Cancel", onclick: () => { state.confirmDelete = false; render(); } }))));

    return [
      h("h1", { text:"Settings" }),
      h("section", { class:"section" }, h("h2", { text:"Today screen" }), h("div", { class:"group" },
        settingRow("Show how long a task has waited", "A one-line footnote: days waited, and days until your deadline if you set one.", toggle("set-stakes","stakes"), "set-stakes"),
        settingRow("Tasks without deadlines first", "Nothing else pushes these, so they come up before dated tasks. Deadlines within 3 days still go first.", toggle("set-nd","noDeadlineFirst"), "set-nd"))),
      h("section", { class:"section" }, h("h2", { text:"Breakdowns" }), h("div", { class:"group" },
        settingRow("Ask clarifying questions", "One or two quick questions when a task is vague. Off means steps come back right away.", toggle("set-ask","askQuestions"), "set-ask"),
        settingRow("First step size", "The longest the first step can take.", select("set-first","firstStepMax",[[5,"5 min"],[10,"10 min"],[15,"15 min"]], Number), "set-first"),
        settingRow("Steps per task", "Up to 10 for bigger projects. Fewer can feel lighter to start.", select("set-max","maxSteps",[[3,"3 steps"],[5,"Up to 5"],[10,"Up to 10"]], Number), "set-max"))),
      h("section", { class:"section" }, h("h2", { text:"Google Calendar" }), h("div", { class:"group" },
        settingRow("Show calendar button", "Adds today's step to Google Calendar in one tap.", toggle("set-cal","calendar"), "set-cal"))),
      h("section", { class:"section" }, h("h2", { text:"Appearance" }), h("div", { class:"group" },
        settingRow("Theme", null, select("set-theme","theme",[["system","Match system"],["light","Light"],["dark","Dark"]]), "set-theme"))),
      h("section", { class:"section" }, h("h2", { text:"Account" }), h("div", { class:"group" },
        settingRow("Name", null, nameIn, "set-name"),
        (SB ? settingRow("Email", "Your sign-in email", h("span", { class:"pill", text: p.email || "" })) : settingRow("Email", null, emailIn, "set-email")),
        settingRow("Working toward", "Shapes how steps are written.", focusSel, "set-focus"),
        settingRow("Storage", SB ? "Synced across your devices" : "Saved in this browser only", h("span", { class:"pill", text: SB ? "Synced" : "This browser" })))),
      h("section", { class:"section" }, h("h2", { text:"Help" }), h("div", { class:"group" },
        settingRow("How First Step works", "A 4-screen walkthrough of the app.", h("button", { type:"button", text:"Show me", onclick: startTour })),
        settingRow("Behind the build", "The research, the success metrics, and what changed.", h("button", { type:"button", text:"Open", onclick: openBuild })))),
      danger,
      h("p", { class:"fine", style:"text-align:center", text:"First Step · v0.7" })
    ];
  }
  async function deleteAll(){
    const ids = [...state.tasks.keys(), "settings", "profile"];
    if (state.mode === "db") await Promise.all(ids.map(id => col.doc(id).delete().catch(() => {})));
    state.tasks.clear(); state.profile = null; state.settings = { ...DEFAULT_SETTINGS }; state.confirmDelete = false;
    ["tasks","settings","profile"].forEach(k => lsSet(LS[k], null)); resetStats();
    if (SB) { try { await SB.auth.signOut(); } catch {} me = null; }
    applyTheme(); state.screen = "welcome"; render();
  }

  // ---------- shell ----------
  function nav(){
    const tabs = [["today","Today"],["add","Add"],["tasks","Tasks"],["settings","Settings"]];
    return h("nav", { class:"tabs", "aria-label":"Main" }, tabs.map(([id, label]) =>
      h("button", { type:"button", "aria-current": state.tab === id ? "page" : null, onclick: () => { state.tab = id; state.confirmDelete = false; if (id !== "add" && state.capture.phase === "idle") state.capture.msg = ""; render(); window.scrollTo(0,0); } }, svg(ICONS[id]), label)));
  }
  function render(){
    const app = $("app");
    // Don't blow away an inline edit or a text field mid-typing.
    const a = document.activeElement;
    if (a && app.contains(a) && (a.classList.contains("step-edit") || a.id === "set-name" || a.id === "set-email")) return;
    let content;
    app.dataset.view = ["splash","welcome","signin","signup","tour","confirm","newpass"].includes(state.screen) ? "auth" : "main";
    if (state.screen === "splash") content = [screenSplash()];
    else if (state.screen === "welcome") content = [screenWelcome()];
    else if (state.screen === "signin") content = [screenSignin()];
    else if (state.screen === "signup") content = [screenSignup()];
    else if (state.screen === "tour") content = [screenTour()];
    else if (state.screen === "confirm") content = [screenConfirm()];
    else if (state.screen === "newpass") content = [screenNewPass()];
    else if (state.screen === "build") content = [screenBuild()];
    else {
      const body = state.tab === "add" ? tabAdd() : state.tab === "tasks" ? tabTasks() : state.tab === "settings" ? tabSettings() : tabToday();
      content = [h("main", { class:"screen" }, body, toastMsg ? h("p", { class:"status err", role:"status", text: toastMsg }) : null), nav()];
    }
    const focusId = a && a.id && app.contains(a) ? a.id : null;
    app.replaceChildren(...content);
    if (focusId) { const el = $(focusId); if (el) el.focus(); }
  }

  // ---------- boot ----------
  initStats();
  render();
  (async () => {
    try { const r = await fetch("/api/config", { cache: "no-store" }); if (r.ok) Object.assign(CFG, await r.json()); } catch {}
    if (CFG.ai) sample = { json: (payload) => aiCall(payload) };
    if (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase) {
      try { SB = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey); } catch { SB = null; }
    }
    if (!SB) {
      state.mode = "local"; loadLocal(); state.ready = true;
      state.screen = (state.profile && !lsGet(LS.signedOut)) ? "app" : "welcome";
      applyTheme(); render(); return;
    }
    SB.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") { state.screen = "newpass"; render(); return; }
      if (event === "SIGNED_IN" && session && state.screen !== "newpass" && me !== session.user.id) setTimeout(() => onSession(session), 0);
    });
    const { data } = await SB.auth.getSession();
    state.ready = true;
    if (data.session && state.screen !== "newpass") await onSession(data.session);
    else if (state.screen !== "newpass") { state.screen = "welcome"; applyTheme(); render(); }
  })();
})();
</script>
</body>
</html>
